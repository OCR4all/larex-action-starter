[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project]
name = "larex-action"
version = "0.1.0"
description = "Starter template for LAREX Action processors"
readme = "README.md"
authors = [
    { name = "OCR4all", email = "ocr4all@uni-wuerzburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "larex-action-sdk[fastapi]>=0.14.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]
